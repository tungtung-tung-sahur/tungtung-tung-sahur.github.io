<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Italian Brainrot Quiz</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#110b24;color:#f6f1ff;font-family:system-ui,sans-serif}body{display:grid;place-items:center;padding:16px}main{width:min(100%,680px);text-align:center}h1{font-size:clamp(22px,4vw,32px);margin:4px 0 12px}.bar{display:flex;justify-content:space-between;gap:12px;margin:12px 0;color:#cec0eb}img{display:block;width:min(100%,300px);height:min(38vh,300px);object-fit:contain;margin:12px auto;border-radius:16px;background:#211535}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{font:inherit;color:inherit;background:#38234e;border:1px solid #8a55b9;border-radius:12px;padding:14px;cursor:pointer;min-height:48px}button:hover:not(:disabled),button:focus-visible{background:#673090;outline:2px solid #f1b4ff;outline-offset:2px}button:disabled{cursor:default;opacity:.7}.correct{background:#196741!important}.wrong{background:#962d48!important}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:16px 0}#feedback{min-height:30px;margin:12px 0;color:#e9cbff}[hidden]{display:none!important}@media(max-width:420px){body{padding:10px}button{padding:10px;font-size:14px}img{height:30vh}.bar{font-size:14px}}</style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7305083056611385"
     crossorigin="anonymous"></script>
</head><body><main><h1>Italian Brainrot Quiz</h1><section id="start"><p>Can you recognize all eight characters?</p><div class="actions"><button id="classic">Classic — no time limit</button><button id="speedrun">Speedrun — 10 seconds each</button></div><p id="best"></p></section><section id="game" hidden><div class="bar"><span id="progress"></span><span id="score"></span><span id="clock"></span></div><img id="portrait" alt="Mystery brainrot character"><h2>Who is this?</h2><div id="answers" class="answers"></div><p id="feedback" role="status" aria-live="polite"></p><div class="actions"><button id="next" hidden>Next question</button><button id="restart">Restart</button></div></section><section id="result" hidden><h2>Quiz complete!</h2><p id="total"></p><div class="actions"><button id="again">Play again</button></div></section></main><script>
const characters=[['Tung Tung Sahur','char-tung-tung-sahur.png'],['Bombardiro Crocodilo','char-bombardiro.png'],['Tralalero Tralala','char-tralalero.png'],['Brr Brr Patapim','char-brr-brr.png'],['Ballerina Cappuccina','char-ballerina.png'],['Boneca Ambalabu','char-boneca.png'],['Capybarello Cocosini','char-capybarello.png'],['Chimpanzini Bananini','char-chimpanzini.png']];
const el=id=>document.getElementById(id);let order=[],position=0,points=0,timed=false,answered=false,timer=null,seconds=10,started=0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function home(){clearInterval(timer);el('start').hidden=false;el('game').hidden=true;el('result').hidden=true;try{const b=localStorage.getItem('brainrot-quiz-best');el('best').textContent=b?'Your best score: '+b+'/8':''}catch(e){}}
function begin(speed){timed=speed;order=shuffle(characters);position=0;points=0;started=Date.now();el('start').hidden=true;el('result').hidden=true;el('game').hidden=false;question()}
function question(){clearInterval(timer);answered=false;seconds=10;const item=order[position];el('progress').textContent='Question '+(position+1)+' / '+order.length;el('score').textContent='Score: '+points;el('clock').textContent=timed?'10s':'';el('feedback').textContent='';el('next').hidden=true;el('portrait').src='../../images/'+item[1];el('answers').replaceChildren();const choices=shuffle([item,...shuffle(characters.filter(c=>c!==item)).slice(0,3)]);choices.forEach(c=>{const b=document.createElement('button');b.textContent=c[0];b.dataset.name=c[0];b.onclick=()=>answer(c[0]);el('answers').appendChild(b)});if(timed)timer=setInterval(()=>{seconds--;el('clock').textContent=seconds+'s';if(seconds<=0)answer(null)},1000)}
function answer(name){if(answered)return;answered=true;clearInterval(timer);const correct=order[position][0];if(name===correct)points++;for(const b of el('answers').children){b.disabled=true;if(b.dataset.name===correct)b.classList.add('correct');else if(b.dataset.name===name)b.classList.add('wrong')}el('score').textContent='Score: '+points;el('feedback').textContent=name===correct?'Correct!':(name===null?'Time is up. ':'')+'Correct answer: '+correct;el('next').textContent=position===order.length-1?'See results':'Next question';el('next').hidden=false}
function finish(){clearInterval(timer);el('game').hidden=true;el('result').hidden=false;el('total').textContent=points+' / '+order.length+' correct · '+Math.round((Date.now()-started)/1000)+' seconds';try{const best=Number(localStorage.getItem('brainrot-quiz-best')||0);if(points>best)localStorage.setItem('brainrot-quiz-best',String(points))}catch(e){}}
el('classic').onclick=()=>begin(false);el('speedrun').onclick=()=>begin(true);el('next').onclick=()=>{if(++position<order.length)question();else finish()};el('restart').onclick=home;el('again').onclick=home;home();
</script>
